<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Canceled | Fast Track School Supplies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --teal:#223A3F; --orange:#C4372B; --cream:#FAF6EF; --line:#E8E4DC; --muted:#6A6F71; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Barlow', system-ui, sans-serif; background: var(--cream); color: var(--teal); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .card { background: #fff; border-radius: 24px; padding: 56px 48px; max-width: 520px; text-align: center; box-shadow: 0 30px 80px rgba(34,58,63,0.1); }
  .icon { width: 72px; height: 72px; background: var(--cream); border-radius: 50%; display: grid; place-items: center; margin: 0 auto 24px; color: var(--orange); }
  h1 { font-family: 'Parkinsans', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; margin-bottom: 12px; }
  p { font-size: 16px; color: var(--muted); margin-bottom: 28px; }
  .btn { background: var(--orange); color: #fff; padding: 16px 28px; border-radius: 999px; font-family: 'Parkinsans', sans-serif; font-weight: 600; font-size: 15px; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
  .alt { display: block; margin-top: 16px; color: var(--muted); font-size: 14px; text-decoration: underline; }
</style>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
<link rel="stylesheet" href="/motion.css" />
<script defer src="/motion.js"></script>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <h1>Checkout canceled.</h1>
    <p>No charge was made. Your kit is still here whenever you're ready.</p>
    <a href="/" class="btn">Keep browsing</a>
    <a href="/upload" class="alt">Or upload a different list</a>
  </div>
</body>
</html>
